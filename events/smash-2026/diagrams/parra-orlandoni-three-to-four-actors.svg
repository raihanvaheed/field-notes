<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" style="font-family: Archivo, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">From three societal actors to four</title>
  <desc id="d">Left: people, the state and enterprises, each connected to the other two. Right: the same three plus AI as a fourth actor, connected to all of them. Adapted from M. Alejandra Parra-Orlandoni's talk at SMASH 2026.</desc>
  <rect x="0" y="0" width="800" height="400" fill="#0a1524"/>
  <line x1="400" y1="30" x2="400" y2="370" stroke="#1e3048" stroke-width="1"/>
  <text x="205" y="48" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Three actors</text>
  <g stroke="#3b5a7a" stroke-width="2">
    <line x1="110" y1="145" x2="300" y2="145"/>
    <line x1="110" y1="145" x2="205" y2="300"/>
    <line x1="300" y1="145" x2="205" y2="300"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <circle cx="110" cy="145" r="54" fill="#0d1b2a" stroke="#3b5a7a" stroke-width="2"/><text x="110" y="150" fill="#e6edf3">Enterprises</text>
    <circle cx="300" cy="145" r="54" fill="#0d1b2a" stroke="#3b5a7a" stroke-width="2"/><text x="300" y="150" fill="#e6edf3">State</text>
    <circle cx="205" cy="300" r="54" fill="#0d1b2a" stroke="#3b5a7a" stroke-width="2"/><text x="205" y="305" fill="#e6edf3">People</text>
  </g>
  <text x="595" y="48" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">Four actors</text>
  <g stroke="#3b5a7a" stroke-width="2">
    <line x1="495" y1="125" x2="695" y2="125"/>
    <line x1="495" y1="125" x2="595" y2="215"/>
    <line x1="695" y1="125" x2="595" y2="215"/>
  </g>
  <g stroke="#22d3ee" stroke-width="2">
    <line x1="495" y1="125" x2="595" y2="320"/>
    <line x1="695" y1="125" x2="595" y2="320"/>
    <line x1="595" y1="215" x2="595" y2="320"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <circle cx="495" cy="125" r="52" fill="#0d1b2a" stroke="#3b5a7a" stroke-width="2"/><text x="495" y="130" fill="#e6edf3">Enterprises</text>
    <circle cx="695" cy="125" r="52" fill="#0d1b2a" stroke="#3b5a7a" stroke-width="2"/><text x="695" y="130" fill="#e6edf3">State</text>
    <circle cx="595" cy="215" r="48" fill="#0d1b2a" stroke="#3b5a7a" stroke-width="2"/><text x="595" y="220" fill="#e6edf3">People</text>
    <circle cx="595" cy="325" r="48" fill="#11283d" stroke="#22d3ee" stroke-width="2"/><text x="595" y="330" fill="#e6edf3" font-weight="700">AI</text>
  </g>
</svg>
